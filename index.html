<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片水印打码工具</title>
    <style>
      /* ── Reset ── */
      html { font-size: 100%; box-sizing: border-box; }
      *, *:before, *:after { box-sizing: inherit; }
      body { margin: 0; padding: 0; }
      button, input, select, textarea, label {
        margin: 0; padding: 0;
        font-family: inherit; font-size: inherit;
      }
      img { max-width: 100%; }

      /* ── Base ── */
      body {
        /* 标题用衬线，正文/控件用无衬线 */
        font-family: -apple-system, 'Helvetica Neue', Arial,
          'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: #111;
        background: #fff;
        padding: 40px 24px 60px;
      }

      a {
        color: #111;
        text-decoration: none;
        border-bottom: 1px solid #ccc;
      }
      a:hover { color: #007acc; border-bottom-color: #007acc; }

      /* ── Container ── */
      .container { max-width: 1100px; margin: 0 auto; }

      /* ── Header ── */
      header {
        margin-bottom: 32px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e8e8e8;
      }
      header .label {
        font-size: 11px;
        color: #aaa;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 0 0 6px;
      }
      header h1 {
        /* 标题保留衬线风格 */
        font-family: Optima, 'Lucida Sans', 'Source Han Serif SC',
          'Noto Serif CJK SC', 'Songti SC', Georgia, serif;
        margin: 0 0 6px;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.2;
      }
      header .desc {
        color: #666;
        font-size: 13px;
        margin: 0;
      }

      /* ── Tool layout ── */
      .tool-wrap {
        display: flex;
        gap: 0;
        align-items: stretch;
      }
      .controls {
        width: 380px;
        flex-shrink: 0;
        padding-right: 32px;
        border-right: 1px solid #e8e8e8;
      }
      .preview-area {
        flex: 1;
        min-width: 0;
        padding-left: 32px;
        display: flex;
        flex-direction: column;
      }

      /* ── Section ── */
      .section { margin-bottom: 18px; }
      .section-title {
        font-size: 11px;
        color: #aaa;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 7px;
      }

      /* ── Drop zone ── */
      #drop-zone {
        border: 1px dashed #ccc;
        padding: 14px 12px;
        text-align: center;
        background: #fafafa;
        transition: border-color 0.15s, background 0.15s;
      }
      #drop-zone.drag-over { border-color: #111; background: #f0f0f0; }
      #drop-zone p { margin: 0 0 2px; font-size: 13px; color: #444; }
      #drop-zone .hint { font-size: 11px; color: #aaa; }

      /* ── File input ── */
      .file-input {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: #666;
        cursor: pointer;
      }
      .file-input::file-selector-button {
        font-family: inherit;
        font-size: 12px;
        padding: 3px 10px;
        border: 1px solid #ccc;
        background: #fff;
        color: #444;
        cursor: pointer;
        margin-right: 8px;
      }
      .file-input::file-selector-button:hover { border-color: #111; }

      /* ── Radio tabs ── */
      .radio-group { display: flex; }
      .radio-group input[type="radio"] { display: none; }
      .radio-group .tab {
        display: block;
        padding: 4px 12px;
        font-size: 12px;
        border: 1px solid #ccc;
        border-right: none;
        color: #666;
        user-select: none;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .radio-group label:last-child .tab { border-right: 1px solid #ccc; }
      .radio-group input[type="radio"]:checked + .tab {
        background: #111; color: #fff; border-color: #111;
      }

      /* ── Text input ── */
      .text-input {
        width: 100%;
        padding: 5px 9px;
        border: 1px solid #ccc;
        background: #fff;
        color: #111;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }
      .text-input:focus { border-color: #888; }
      .text-input::placeholder { color: #ccc; }

      /* ── Position buttons ── */
      .pos-group { display: flex; flex-wrap: wrap; gap: 4px; }
      .pos-group input[type="radio"] { display: none; }
      .pos-group .pos-btn {
        display: block;
        padding: 3px 10px;
        font-size: 12px;
        border: 1px solid #ccc;
        color: #666;
        cursor: pointer;
        user-select: none;
        transition: background 0.12s, color 0.12s;
      }
      .pos-group input[type="radio"]:checked + .pos-btn {
        background: #111; color: #fff; border-color: #111;
      }

      /* ── Color ── */
      .color-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .color-chip {
        width: 28px; height: 24px;
        border: 1px solid #ccc;
        flex-shrink: 0;
      }
      .color-pick-btn {
        flex: 1;
        padding: 3px 8px;
        border: 1px solid #ccc;
        background: #fff;
        color: #444;
        font-size: 12px;
        cursor: pointer;
        text-align: center;
        position: relative;
      }
      .color-pick-btn:hover { border-color: #888; }
      #color { position: absolute; opacity: 0; width: 0; height: 0; }
      .color-hex {
        font-size: 11px; color: #aaa;
        font-family: "Lucida Console", "Consolas", monospace;
        flex-shrink: 0;
      }
      .preset-row { display: flex; gap: 4px; }
      .preset-btn {
        flex: 1; padding: 3px 0;
        border: 1px solid transparent;
        font-size: 11px; cursor: pointer;
        color: #fff; text-align: center;
        transition: opacity 0.12s;
      }
      .preset-btn.light { color: #444; border-color: #ccc; }
      .preset-btn:hover { opacity: 0.75; }

      /* ── Sliders ── */
      .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
      .slider-item.full { grid-column: 1 / -1; }
      .slider-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #555;
        margin-bottom: 2px;
      }
      .slider-label .val {
        color: #aaa;
        font-family: "Lucida Console", "Consolas", monospace;
        font-size: 11px;
      }
      input[type="range"] { width: 100%; cursor: pointer; accent-color: #111; }

      /* ── Buttons ── */
      .btn-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid #e8e8e8;
      }
      .btn-left, .btn-right { display: flex; align-items: center; gap: 8px; }

      .check-wrap {
        display: flex; align-items: center; gap: 5px;
        font-size: 12px; color: #666; cursor: pointer;
      }
      .check-wrap input { cursor: pointer; accent-color: #111; }

      .btn {
        padding: 4px 12px;
        font-family: inherit; font-size: 12px;
        border: 1px solid #ccc;
        background: #fff; color: #444;
        cursor: pointer;
        transition: border-color 0.12s, color 0.12s;
      }
      .btn:hover { border-color: #888; color: #111; }
      .btn.primary { background: #111; color: #fff; border-color: #111; }
      .btn.primary:hover { background: #333; border-color: #333; }
      .btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

      /* ── Preview ── */
      .preview-label {
        font-size: 11px;
        color: #aaa;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 7px;
      }
      #graph {
        flex: 1;
        border: 1px solid #e8e8e8;
        background: #fafafa;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #ccc;
      }
      #graph canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      /* ── Misc ── */
      .hidden { display: none !important; }
      .control-disabled { opacity: 0.3; pointer-events: none; transition: opacity 0.2s; }
      .hint-text { font-size: 11px; color: #aaa; margin-top: 3px; }

      /* ── Footer ── */
      footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid #e8e8e8;
        text-align: center;
        font-size: 12px;
        color: #bbb;
      }
      footer a { color: #bbb; border-bottom-color: #e0e0e0; }
      footer a:hover { color: #007acc; }

      /* ── Responsive ── */
      @media (max-width: 760px) {
        body { padding: 20px 16px 40px; }
        .tool-wrap { flex-direction: column; }
        .controls {
          width: 100%; padding-right: 0;
          border-right: none;
          border-bottom: 1px solid #e8e8e8;
          padding-bottom: 20px;
          margin-bottom: 20px;
        }
        .preview-area { padding-left: 0; }
        #graph { min-height: 200px; }
      }
      @media (max-width: 480px) {
        header h1 { font-size: 22px; }
        .slider-grid { grid-template-columns: 1fr; }
        .slider-item.full { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <p class="label">Local Watermark Studio</p>
        <h1>图片水印打码工具</h1>
        <p class="desc">安全地为你的图片添加水印，全程本地处理，特别适用于身份证、驾照、护照等敏感证件。</p>
      </header>

      <div class="tool-wrap">
        <!-- Controls -->
        <div class="controls">

          <div class="section">
            <p class="section-title">上传图片</p>
            <div id="drop-zone">
              <p>拖拽图片到此处，或粘贴 (Ctrl+V)</p>
              <p class="hint">支持 PNG / JPG / GIF</p>
              <div style="display:flex;justify-content:center;margin-top:8px;">
                <input type="file" id="image" accept="image/png,image/jpeg,image/gif"
                  autocomplete="off" class="file-input" style="width:auto;" />
              </div>
            </div>
          </div>

          <div class="section">
            <p class="section-title">水印类型</p>
            <div class="radio-group">
              <label>
                <input type="radio" name="watermark-type" value="text" checked />
                <span class="tab">文字水印</span>
              </label>
              <label>
                <input type="radio" name="watermark-type" value="image" />
                <span class="tab">图片水印</span>
              </label>
            </div>
            <div id="text-watermark" style="margin-top: 8px;">
              <input type="text" id="text" placeholder="请输入水印文字，30 字以内"
                autocomplete="off" maxlength="30" class="text-input" />
            </div>
            <div id="image-watermark" class="hidden" style="margin-top: 8px;">
              <input type="file" id="watermark-image"
                accept="image/png,image/jpeg,image/gif" class="file-input" />
              <p class="hint-text">建议使用透明背景的 PNG</p>
            </div>
          </div>

          <div class="section">
            <p class="section-title">位置</p>
            <div class="pos-group">
              <label><input type="radio" name="position" value="tile" checked /><span class="pos-btn">平铺</span></label>
              <label><input type="radio" name="position" value="top-left" /><span class="pos-btn">左上</span></label>
              <label><input type="radio" name="position" value="top-right" /><span class="pos-btn">右上</span></label>
              <label><input type="radio" name="position" value="bottom-left" /><span class="pos-btn">左下</span></label>
              <label><input type="radio" name="position" value="bottom-right" /><span class="pos-btn">右下</span></label>
              <label><input type="radio" name="position" value="center" /><span class="pos-btn">居中</span></label>
            </div>
          </div>

          <div id="color-control" class="section">
            <p class="section-title">颜色</p>
            <div class="color-row">
              <span id="color-chip" class="color-chip" style="background:#7f7f7f"></span>
              <label class="color-pick-btn">
                选取颜色
                <input type="color" id="color" autocomplete="off" value="#7F7F7F" />
              </label>
              <span id="color-value" class="color-hex">#7F7F7F</span>
            </div>
            <div class="preset-row">
              <button type="button" data-color-preset="#222222" class="preset-btn" style="background:#222">深</button>
              <button type="button" data-color-preset="#f97316" class="preset-btn" style="background:#f97316">橙</button>
              <button type="button" data-color-preset="#9f6b53" class="preset-btn" style="background:#9f6b53">棕</button>
              <button type="button" data-color-preset="#f8fafc" class="preset-btn light" style="background:#f8fafc">浅</button>
            </div>
          </div>

          <div class="section">
            <p class="section-title">参数调节</p>
            <div class="slider-grid">
              <div class="slider-item">
                <div class="slider-label"><label for="alpha">透明度</label><span id="alpha-value" class="val">50%</span></div>
                <input type="range" id="alpha" min="0" max="1" step="0.05" autocomplete="off" value="0.5" />
              </div>
              <div class="slider-item">
                <div class="slider-label"><label for="size">大小</label><span id="size-value" class="val">1.0×</span></div>
                <input type="range" id="size" min="0.5" max="3" step="0.05" autocomplete="off" value="1" />
              </div>
              <div id="weight-control" class="slider-item">
                <div class="slider-label"><label for="weight">粗细</label><span id="weight-value" class="val">700</span></div>
                <input type="range" id="weight" min="100" max="900" step="100" autocomplete="off" value="700" />
              </div>
              <div id="angle-control" class="slider-item">
                <div class="slider-label"><label for="angle">角度</label><span id="angle-value" class="val">45°</span></div>
                <input type="range" id="angle" min="-90" max="90" step="3" autocomplete="off" value="45" />
              </div>
              <div id="space-control" class="slider-item">
                <div class="slider-label"><label for="space">行距</label><span id="space-value" class="val">4.0×</span></div>
                <input type="range" id="space" min="1" max="8" step="0.2" autocomplete="off" value="4" />
              </div>
              <div id="inline-control" class="slider-item">
                <div class="slider-label"><label for="inline">横向间距</label><span id="inline-value" class="val">1.0×</span></div>
                <input type="range" id="inline" min="0" max="4" step="0.1" autocomplete="off" value="1" />
              </div>
            </div>
          </div>

          <div class="btn-row">
            <div class="btn-left">
              <label class="check-wrap">
                <input type="checkbox" id="auto-refresh" autocomplete="off" checked />
                实时预览
              </label>
              <button id="refresh" disabled class="btn">刷新</button>
            </div>
            <div class="btn-right">
              <button id="reset" class="btn">重置</button>
              <button id="download" disabled class="btn primary">下载</button>
            </div>
          </div>

        </div>

        <!-- Preview -->
        <div class="preview-area">
          <p class="preview-label">预览</p>
          <div id="graph">请先上传图片</div>
        </div>
      </div>

      <footer>
        <a href="https://github.com/mingzaily/watermarking">在 GitHub 上查看源码</a>
      </footer>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
